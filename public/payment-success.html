<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status — Top Video Games</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:680px;margin:12vh auto;padding:30px;text-align:center"><h1>PAYMENT STATUS</h1><p id="status">Checking your payment confirmation...</p><a class="primary-btn" href="/">RETURN TO GAMES</a></main><script>(async()=>{const el=document.getElementById('status'),reference=new URLSearchParams(location.search).get('reference');if(!reference){el.textContent='No payment reference was provided.';return;}for(let i=0;i<15;i++){try{const r=await fetch('/api/stripe/payment-status?reference='+encodeURIComponent(reference),{cache:'no-store'}),d=await r.json();if(!r.ok){el.textContent=d.error||'Please log in to check your purchase.';return;}if(d.status==='paid'){el.textContent='Payment confirmed! Your '+d.plan+' access is now active.';return;}if(['failed','canceled'].includes(d.status)){el.textContent='Payment was not completed.';return;}}catch(e){}await new Promise(resolve=>setTimeout(resolve,2000));}el.textContent='Your payment is still being confirmed. If you were charged, please do not pay again. Contact support if access does not appear.';})();</script></body></html>
