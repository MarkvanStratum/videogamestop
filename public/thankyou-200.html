<body>
  <main>
    <h1>Thank you for your order.</h1>
    <p>We will contact you shortly with delivery details.</p>
  </main>

  <!-- Trigger Meta & TikTok Purchase Events -->
  <script>
    try {
      const qs = new URLSearchParams(location.search);
      const value = +(qs.get("value") || qs.get("amount") || 200);
      const currency = (qs.get("currency") || "ZAR").toUpperCase();
      const orderId = qs.get("order_id") || qs.get("v") || qs.get("oid") || ("ORD-" + Date.now());
      
      // 1. Meta Purchase Fire
      const fbKey = "fb_purchase_" + orderId;
      if (!sessionStorage.getItem(fbKey)) {
        fbq('track', 'Purchase', {
          value: value,
          currency: currency,
          content_type: 'product',
          content_ids: [orderId],
          num_items: 1
        });
        sessionStorage.setItem(fbKey, "1");
        console.log("[Meta Pixel] Purchase fired for order:", orderId);
      }

      // 2. TikTok Purchase Fire
      const ttKey = "ttq_purchase_" + orderId;
      if (typeof ttq !== 'undefined' && !sessionStorage.getItem(ttKey)) {
        ttq.track("Purchase", {
          value: value,
          currency: currency,
          contents: [{ content_type: "product", content_id: orderId, quantity: 1, price: value }],
          description: "Order " + orderId
        });
        sessionStorage.setItem(ttKey, "1");
        console.log("[TikTok Pixel] Purchase fired for order:", orderId);
      }
    } catch (e) {
      console.error("[Tracking Error]", e);
    }
  </script>

  <!-- Ensure sub_id is present in URL before GoAffPro loads -->
  <script>
    (function ensureSubIdInURL(){
      var url = new URL(location.href);
      if (!url.searchParams.get("sub_id")) {
        function getStored(){
          try{
            var m = document.cookie.match(/(?:^|; )aff_sub_id=([^;]*)/);
            if (m) return decodeURIComponent(m[1]);
            var ls = localStorage.getItem("aff_sub_id");
            if (ls) return ls;
          }catch(e){}
          return null;
        }
        var sub = getStored();
        if (!sub && document.referrer) {
          try{
            var ref = new URL(document.referrer);
            sub = ref.searchParams.get("sub_id") || ref.searchParams.get("subid") ||
                  ref.searchParams.get("aff_sub") || ref.searchParams.get("click_id") ||
                  ref.searchParams.get("cid")    || ref.searchParams.get("tid");
          }catch(e){}
        }
        if (sub) {
          url.searchParams.set("sub_id", sub);
          history.replaceState(null, "", url.toString());
        }
      }
    })();
  </script>

  <!-- GoAffPro loader -->
  <script src="https://api.goaffpro.com/loader.js?shop=nzyvwvfbde"></script>

  <!-- Idempotent GoAffPro conversion fire -->
  <script>
    const qsGo = new URLSearchParams(location.search);
    const orderIdGo =
      qsGo.get('v') || qsGo.get('order_id') || qsGo.get('oid') || qsGo.get('t') || ('TEST-' + Date.now());

    function alreadyFired(id){
      try { return JSON.parse(localStorage.getItem('goaffpro_fired')||'{}')[id]; } catch { return false; }
    }
    function markFired(id){
      try {
        const m = JSON.parse(localStorage.getItem('goaffpro_fired')||'{}');
        m[id] = Date.now();
        localStorage.setItem('goaffpro_fired', JSON.stringify(m));
      } catch {}
    }

    var goaffproOrder = {
      id: orderIdGo,
      number: orderIdGo,
      total: 200,
      currency: "USD",
      forceSDK: true
    };

    (function wait(i){
      if (alreadyFired(orderIdGo)) return;
      if (typeof window.goaffproTrackConversion === "function") {
        window.goaffproTrackConversion(goaffproOrder);
        markFired(orderIdGo);
      } else if (i < 50) {
        setTimeout(() => wait(i+1), 200);
      }
    })(0);
  </script>

</body>
