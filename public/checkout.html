<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure checkout — Top Video Games</title><link rel="stylesheet" href="/style.css"><script src="https://js.stripe.com/v3/"></script></head><body><main style="max-width:650px;margin:6vh auto;padding:24px"><a href="/">← Back to games</a><h1>SECURE CHECKOUT</h1><p id="planInfo">Loading your package...</p><section id="checkoutAccount" style="background:#161a29;padding:24px;border-radius:16px;margin-bottom:20px" hidden><h2>Log in or create an account</h2><p>Your purchase will be linked to your account.</p><form id="checkoutAuthForm"><label>Email address<input id="checkoutEmail" type="email" required autocomplete="email" style="display:block;width:100%;padding:12px;margin:10px 0"></label><label>Password (at least 10 characters)<input id="checkoutPassword" type="password" required minlength="10" autocomplete="current-password" style="display:block;width:100%;padding:12px;margin:10px 0"></label><button class="primary-btn" type="submit" id="checkoutAuthSubmit">CREATE ACCOUNT</button><button type="button" id="checkoutAuthToggle" class="secondary-btn">Already registered? Log in</button><p id="checkoutAuthError" role="alert" style="color:#ffb0b0"></p></form></section><form id="paymentForm" style="background:#161a29;padding:24px;border-radius:16px"><label for="cardName">Name on card</label><input id="cardName" autocomplete="cc-name" required maxlength="120" style="display:block;width:100%;padding:12px;margin:12px 0 22px"><div id="card-element" style="background:white;padding:16px;border-radius:8px"></div><p id="error" role="alert" style="color:#ffb0b0"></p><button class="primary-btn" id="pay" type="submit" style="margin-top:20px">PAY SECURELY</button></form><p>One-time payment, no subscription. Card information is collected securely by Stripe.</p></main><script src="/checkout.js"></script></body></html>
